<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo Report Generator</title>
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <img src="assets/logo.png" alt="">
    <div><b>Demo Report Generator</b><span>AI-assisted data-driven reports for SAS Visual Analytics</span></div>
  </div>
  <div class="proj" id="projName"></div>
  <div class="actions">
    <button class="btn ai ai-top" data-ai="open"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>Report Assistant</button>
    <span class="sep"></span>
    <button class="btn ghost" data-act="new">New</button>
    <label class="btn ghost">Open project<input type="file" accept=".json" id="openProject" hidden></label>
    <button class="btn ghost" data-act="saveProject">Save project</button>
  </div>
</header>
<div class="shell">
  <nav class="steps" id="steps"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="js/ddc_template.js"></script>
<script src="js/util.js"></script>
<script src="js/themes.js"></script>
<script src="js/data.js"></script>
<script src="js/suggest.js"></script>
<script src="js/build.js"></script>
<script src="js/preview.js"></script>
<script src="js/app.js"></script>
<script src="js/vendor/anthropic-sdk.js"></script>
<script src="js/ai.js"></script>
</body>
</html>
