<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAS VA data-driven content</title>
<!--
  SAS Visual Analytics - Data-Driven Content (DDC) template used by the Demo Report Generator.
  One self-contained file that draws every custom object of a report; ?visual=.. picks the object.
  The generator replaces the THEME and BRAND blocks below, then stores the file as the "form" of a SAS job.

  Measures are taken in the order of the object's roles: m1, m2, m3. "ratio" always means m2 / m1 (shown as %).
  visual=bg       Page background and header (no data). ?title ?sub ?note ?hdr=<header height> ?ph=<page height>
  visual=filter   Filters other objects. Role: one category. ?mode=pills|list|dropdown ?sort=auto|asc|desc
  visual=kpi      KPI card. Roles: [date] m1 [m2]. ?metric=value|ratio|share ?spark=1 ?agg=sum|last|avg
  visual=hbar     Horizontal bars. Roles: category m1 [m2]. ?metric=value|ratio ?stack=1 ?top=N ?order=volume ?min=N
  visual=vbar     Columns. Roles: category or date, m1. ?top=N
  visual=line     Time series, one panel per measure (one y scale each). Roles: date m1 [m2] [m3].
                  ?ratio=1 (panel 2 = m2 / m1) ?bars=1 (panel 1 as columns)
  visual=donut    Share by category. Roles: category m1. ?top=6 ?center=<label>
  visual=heatmap  Rows x columns. Roles: row category, column category, m1 [m2]. ?metric=value|ratio ?rows ?cols ?min
  visual=table    Sortable, searchable table. ?cats=<number of category columns first> ?ratio=1 ?rlabel=..
  Objects are drawn in the part of the frame VA shows (see fitBox); ?h=<px> caps the height if it cannot be measured.
  Common: ?title ?icon ?accent=<hex without #> ?fmt=auto|int|dec1|dec2|pct|pct0|pct1|compact|cur0|cur2 ?prefix ?suffix
          ?static=1 (no animation) ?bare=1 (no card) ?demo=1 (sample data)
  Objects that filter others (filter, hbar, vbar, donut) send the clicked rows to VA like a VA chart does.
  Plain ES5. Never put a dollar sign in this file: the SAS job server deletes the text between two dollar signs.
  Keep it ASCII: escape other characters (\uXXXX in script, &#x..; in HTML).
-->
<style id="ddc-theme">
/*@THEME@*/
:root{
  --page:#07111f; --card:#0c1a2e; --card-hi:#11243e; --head:#0e2036; --tip:#050c17;
  --line:rgba(150,185,225,.13); --line-2:rgba(150,185,225,.24);
  --ink:#eef4fb; --ink-2:#b6c7dc; --muted:#8098b4; --faint:#4f6886;
  --accent:#4f98ff; --accent-2:#2cc4e6; --on-accent:#ffffff;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --other:#5b6b80;
  --shadow:rgba(0,0,0,.5); --hover:rgba(255,255,255,.04);
}
/*@/THEME@*/
</style>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
#app{position:absolute;top:var(--vt,0px);left:var(--vl,0px);width:var(--vw,100%);height:var(--vh,100%);overflow:hidden}
body{background:var(--page);color:var(--ink);font:13px/1.35 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}
.card{position:absolute;top:3px;right:3px;bottom:3px;left:3px;border-radius:14px;
  background:linear-gradient(180deg,var(--card-hi),var(--card) 55%);border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.bare .card{top:0;right:0;bottom:0;left:0;border:0;border-radius:0;background:transparent}
.hd{display:flex;align-items:center;gap:10px;padding:11px 14px 6px;flex:none;min-width:0}
.hd h2{margin:0;font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.hd .meta{font-size:11.5px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:10px}
.chip{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none}
.chip svg{width:16px;height:16px}
.bd{flex:1;min-height:0;position:relative}
.note{flex:none;padding:6px 14px 9px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:1px solid var(--line)}
.key{display:inline-flex;align-items:center;gap:5px}
.key i{width:10px;height:10px;border-radius:3px;display:inline-block}
.state{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:12px;padding:10px 14px}
.state.warn{color:#e3a32a}
.sample{position:absolute;right:12px;top:3px;font-size:9px;letter-spacing:.1em;color:var(--faint);text-transform:uppercase;pointer-events:none}
.tip{position:fixed;left:0;top:0;pointer-events:none;z-index:20;background:var(--tip);border:1px solid var(--line-2);border-radius:8px;
  padding:7px 9px;font-size:12px;color:var(--ink);box-shadow:0 8px 24px var(--shadow);max-width:270px;opacity:0;transition:opacity .1s}
.tip b{display:block;font-weight:600;margin-bottom:3px}
.tip .r{display:flex;justify-content:space-between;gap:16px;color:var(--ink-2)}
.tip .r span+span{color:var(--ink);font-variant-numeric:tabular-nums}
.err{position:absolute;left:6px;right:6px;bottom:6px;z-index:30;background:#3a1212;color:#ffd6d6;border:1px solid #7a2a2a;border-radius:8px;padding:6px 9px;font-size:11px}
svg text{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* background page */
.bgp{position:absolute;top:0;right:0;bottom:0;left:0;background:var(--page);overflow:hidden}
.bgp .head{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:16px;padding:0 1.5%;
  background:linear-gradient(180deg,var(--card-hi),var(--card));border-bottom:1px solid var(--line)}
.bgp .head:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,var(--accent) 20%,var(--accent-2) 60%,transparent);opacity:.75}
.bgp .gridbg{position:absolute;left:0;right:0;top:0;pointer-events:none;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:40px 40px;opacity:.45;-webkit-mask-image:linear-gradient(180deg,#000,transparent);mask-image:linear-gradient(180deg,#000,transparent)}
.bgp .logo{flex:none;position:relative;display:flex;align-items:center}
.bgp .logo img{display:block;max-width:220px;object-fit:contain}
.bgp .ttl{position:relative;min-width:0}
.bgp .eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bgp h1{margin:1px 0 0;font-weight:650;letter-spacing:-.01em;color:var(--ink);white-space:nowrap;line-height:1.1}
.bgp .sep{width:1px;align-self:stretch;margin:2.2% 0;background:var(--line-2);flex:none}
.bgp .sub{position:relative;color:var(--ink-2);font-size:13px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.bgp .src{position:relative;flex:none;display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-2);
  border:1px solid var(--line-2);border-radius:999px;padding:5px 11px}
.bgp .src svg{width:14px;height:14px;color:var(--accent-2)}

/* filters */
.flt{position:absolute;top:3px;right:3px;left:3px;height:calc(100% - 6px);max-height:52px;display:flex;align-items:center;gap:10px;padding:0 6px 0 12px;
  border-radius:12px;background:var(--card);border:1px solid var(--line)}
.flt .lab{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);flex:none;display:flex;align-items:center;gap:6px;max-width:40%}
.flt .lab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flt .lab svg{width:14px;height:14px;flex:none}
.pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;padding:2px 0;align-items:center}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;border:1px solid var(--line-2);background:transparent;color:var(--ink-2);font-size:12.5px;padding:0 12px;
  border-radius:999px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.pill:hover{border-color:var(--accent);color:var(--ink)}
.pill.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.dd{flex:1;min-width:0;position:relative;height:calc(100% - 14px);max-height:34px}
.dd select{width:100%;height:100%;appearance:none;-webkit-appearance:none;border:1px solid var(--line-2);border-radius:9px;background:transparent;
  color:var(--ink);padding:0 30px 0 11px;font-size:12.5px;cursor:pointer;outline:none}
.dd select option{background:var(--card);color:var(--ink)}
.dd select:focus{border-color:var(--accent)}
.dd svg{position:absolute;right:10px;top:50%;width:12px;height:12px;margin-top:-6px;pointer-events:none;color:var(--muted)}
.dd.on select{border-color:var(--accent)}
.srch{position:relative;margin:0 14px 8px;flex:none}
.srch svg{position:absolute;left:9px;top:50%;width:14px;height:14px;margin-top:-7px;color:var(--muted)}
.srch input{width:100%;height:30px;border-radius:8px;border:1px solid var(--line-2);background:transparent;color:var(--ink);padding:0 10px 0 29px;font-size:12.5px;outline:none}
.srch input:focus{border-color:var(--accent)}
.lst{position:absolute;top:0;right:0;bottom:0;left:0;overflow-y:auto;padding:0 8px 8px}
.opt{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:7px;cursor:pointer;color:var(--ink-2);font-size:12.5px;user-select:none}
.opt:hover{background:var(--hover);color:var(--ink)}
.opt .bx{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--faint);flex:none;display:flex;align-items:center;justify-content:center}
.opt .bx svg{width:11px;height:11px;opacity:0;color:var(--on-accent)}
.opt.on{color:var(--ink)}
.opt.on .bx{background:var(--accent);border-color:var(--accent)}
.opt.on .bx svg{opacity:1}
.opt .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt .n{color:var(--muted);font-variant-numeric:tabular-nums}
.lnk{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-size:11.5px}
.lnk:hover{text-decoration:underline}

/* KPI */
.kpi .bd{display:flex;align-items:flex-end;gap:14px;padding:0 14px 12px}
.kpi .kv{flex:none;min-width:0;max-width:100%}
.kpi .val{font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.05;white-space:nowrap}
.kpi .sub{color:var(--muted);font-size:12px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .meter{height:6px;border-radius:3px;background:var(--line);margin-top:9px;overflow:hidden;width:min(220px,100%)}
.kpi .meter i{display:block;height:100%;border-radius:0 3px 3px 0;background:var(--s2)}
.kpi .spark{flex:1;min-width:50px;align-self:stretch;position:relative}
.kpi .mbox{flex:1;min-width:60px;padding-bottom:9px}
.kpi .mbox .meter{width:100%;margin:0;height:8px;border-radius:4px}

/* bars */
.bars{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;overflow-y:auto;padding:2px 10px 4px}
.bar{display:flex;align-items:center;gap:10px;cursor:pointer;flex:1 1 0;min-height:20px;max-height:40px;border-radius:6px;padding:0 4px}
.bar:hover{background:var(--hover)}
.bar .lb{flex:none;color:var(--ink-2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.bar .tr{flex:1;min-width:0;height:62%;max-height:16px;display:flex;gap:2px;border-left:1px solid var(--line-2)}
.bar .sg{height:100%;min-width:2px}
.bar .sg.end{border-radius:0 4px 4px 0}
.bar .vl{flex:none;font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.bar .vl span{color:var(--muted)}
.sel .bar:not(.on){opacity:.38}
.bar.on .lb{color:var(--ink);font-weight:600}
.sel .col:not(.on){opacity:.35}
.col{cursor:pointer;transition:opacity .15s}

/* table */
.tw{position:absolute;top:0;right:0;bottom:0;left:0;overflow:auto}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
th{position:sticky;top:0;z-index:1;background:var(--head);color:var(--muted);font-weight:600;font-size:10.5px;text-transform:uppercase;
  letter-spacing:.06em;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line-2);cursor:pointer;white-space:nowrap;user-select:none}
th:hover{color:var(--ink)}
th .ar{color:var(--accent);margin-left:4px}
td{padding:6px 12px;border-bottom:1px solid var(--line);color:var(--ink-2);white-space:nowrap;max-width:340px;overflow:hidden;text-overflow:ellipsis}
th.n,td.n{text-align:right}
td.n{color:var(--ink);font-variant-numeric:tabular-nums}
tr:hover td{background:var(--hover)}
tr.low td{color:var(--faint)}
.ib{display:inline-flex;align-items:center;justify-content:flex-end;gap:8px;width:100%}
.ib i{display:block;height:6px;border-radius:0 3px 3px 0;flex:none}
.ib .t{width:110px;flex:none;display:flex;border-left:1px solid var(--line-2)}
.hd input{height:26px;width:150px;border-radius:7px;border:1px solid var(--line-2);background:transparent;color:var(--ink);padding:0 9px;font-size:12px;outline:none}
.hd input:focus{border-color:var(--accent)}

/* donut */
.dn{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;gap:14px;padding:0 14px 10px}
.dn.vert{flex-direction:column;align-items:stretch}
.dn .pie{flex:none;position:relative}
.dn .lgd{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;overflow-y:auto;max-height:100%}
.lg{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--ink-2)}
.lg:hover{background:var(--hover)}
.lg i{width:10px;height:10px;border-radius:3px;flex:none}
.lg .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg .v{color:var(--ink);font-variant-numeric:tabular-nums}
.lg .p{color:var(--muted);font-variant-numeric:tabular-nums;width:46px;text-align:right}
.lgd.narrow .p{display:none}
.sel .lg:not(.on){opacity:.4}
.sel path.slice:not(.on){opacity:.3}
path.slice{cursor:pointer;transition:opacity .15s}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';
var BRAND = /*@BRAND@*/{"report":"Report","eyebrow":"","logo":"","logoH":0}/*@/BRAND@*/;
var html = document.documentElement, app = document.getElementById('app');

/* ---------- URL options (the generator's preview passes them in window.name: its frames have no URL) ---------- */
var P = {};
(function(){
  var src = location.search || (/^\?/.test(window.name || '') ? window.name : ''), q = src.replace(/^\?/, '').split('&'), i, kv;
  for(i=0;i<q.length;i++){
    if(!q[i]) continue;
    kv = q[i].split('=');
    try { P[decodeURIComponent(kv[0])] = decodeURIComponent((kv.slice(1).join('=') || '').replace(/\+/g, ' ')); } catch(e){}
  }
})();
function opt(k, d){ return P[k] != null && P[k] !== '' ? P[k] : d; }
function numOpt(k, d){ var n = parseFloat(P[k]); return isNaN(n) ? d : n; }
var VIS = opt('visual', 'kpi'), TITLE = opt('title', ''),
    DEMO = opt('demo', '') === '1' || window.parent === window;
if(opt('bare', '') === '1') html.className += ' bare';

/* ---------- theme values for SVG (read from the CSS variables) ---------- */
var CS = getComputedStyle(html);
function cv(n, d){ var v = CS.getPropertyValue(n); return v && v.trim() || d; }
var T = {ink:cv('--ink', '#eef4fb'), ink2:cv('--ink-2', '#b6c7dc'), muted:cv('--muted', '#8098b4'), faint:cv('--faint', '#4f6886'),
  line:cv('--line', 'rgba(150,185,225,.13)'), line2:cv('--line-2', 'rgba(150,185,225,.24)'), card:cv('--card', '#0c1a2e'),
  accent:cv('--accent', '#4f98ff'), other:cv('--other', '#5b6b80')};
var SLOTS = [1, 2, 3, 4, 5, 6].map(function(i){ return cv('--s'+i, '#3987e5'); }), S1 = SLOTS[0], S2 = SLOTS[1];

/* ---------- the visible box ----------
   VA can make an object's frame taller (or wider) than the box it shows and cut the rest off, so content centred in
   the frame lands partly out of view (a filter bar looks pushed down). As a job on the Viya server this page is
   same-origin with VA and can measure the visible part of its frame: everything is drawn inside that box (#app).
   ?h=<px> caps the height when the frame cannot be measured. */
var FIX_H = numOpt('h', 0), boxKey = '';
function boxW(){ return app.clientWidth || innerWidth; }
function boxH(){ return app.clientHeight || innerHeight; }
function fitBox(){
  var fe = null, vt = 0, vl = 0, vh = innerHeight, vw = innerWidth, st = html.style, key;
  try { fe = window.frameElement; } catch(e){ fe = null; }
  if(fe){
    try {
      var r = fe.getBoundingClientRect(), ct = r.top+fe.clientTop, cl = r.left+fe.clientLeft, t = ct, b = ct+fe.clientHeight, l = cl, rt = cl+fe.clientWidth,
          w = fe.ownerDocument.defaultView, p, cs, c;
      for(p = fe.parentElement; p && p.nodeType === 1; p = p.parentElement){
        cs = w.getComputedStyle(p);
        if(cs.overflowX === 'visible' && cs.overflowY === 'visible') continue;
        c = p.getBoundingClientRect();
        /* only the object's own box (about the size of the frame) counts, not the report's scrolling area */
        if(c.width > r.width+40 || c.height > r.height+40) continue;
        if(c.top > t) t = c.top; if(c.bottom < b) b = c.bottom; if(c.left > l) l = c.left; if(c.right < rt) rt = c.right;
      }
      if(b-t >= 20 && rt-l >= 40){ vt = t-ct; vh = b-t; vl = l-cl; vw = rt-l; }
    } catch(e){}
  }
  if(FIX_H) vh = Math.min(vh, FIX_H);
  key = [vt, vl, vh, vw].map(Math.round).join(',');
  if(key === boxKey) return false;
  boxKey = key;
  st.setProperty('--vt', Math.round(vt)+'px'); st.setProperty('--vl', Math.round(vl)+'px');
  st.setProperty('--vh', Math.round(vh)+'px'); st.setProperty('--vw', Math.round(vw)+'px');
  return true;
}
fitBox();

/* ---------- small helpers ---------- */
var ESC = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return ESC[c]; }); }
function toNum(v){ if(v == null || v === '') return null; if(typeof v === 'number') return isFinite(v) ? v : null;
  var n = parseFloat(String(v).replace(/[,%\s]/g, '')); return isNaN(n) ? null : n; }
function grp(s){ return s.replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function fixed(n, d){ if(n == null || isNaN(n)) return '–'; var s = Math.abs(n).toFixed(d), p = s.split('.');
  return (n < 0 && +s !== 0 ? '-' : '')+grp(p[0])+(p[1] ? '.'+p[1] : ''); }
function group(n){ return fixed(n, 0); }
function compact(n){ if(n == null || isNaN(n)) return '–'; var a = Math.abs(n);
  if(a >= 1e9) return (n/1e9).toFixed(a >= 1e10 ? 0 : 1)+'B';
  if(a >= 1e6) return (n/1e6).toFixed(a >= 1e7 ? 0 : 1)+'M';
  if(a >= 1e4) return (n/1e3).toFixed(0)+'K';
  if(a >= 1e3) return (n/1e3).toFixed(1)+'K';
  return Math.round(n) === n ? String(n) : n.toFixed(Math.abs(n) < 1 ? 2 : 1); }
function pct(x, d){ return x == null || isNaN(x) ? '–' : (x*100).toFixed(d == null ? 1 : d)+'%'; }
function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
function niceMax(v){ if(!(v > 0)) return 1; var e = Math.pow(10, Math.floor(Math.log(v)/Math.LN10)), f = v/e;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10)*e; }
/* axis ticks on round steps (1, 2, 2.5, 5 x 10^n) covering lo..hi with about n intervals */
function ticks(lo, hi, n){
  if(!(hi > lo)){ hi = lo+1; }
  var step = niceMax((hi-lo)/n), a = Math.floor(lo/step)*step, b = Math.ceil(hi/step-1e-9)*step, out = [], v;
  for(v=a; v<=b+step*1e-6; v+=step) out.push(+v.toPrecision(12));
  return out.length > 1 ? out : [a, a+step];
}
function hexRgb(h){ h = String(h).replace('#', ''); if(h.length === 3) h = h.charAt(0)+h.charAt(0)+h.charAt(1)+h.charAt(1)+h.charAt(2)+h.charAt(2);

    showTip(tipHtml(G[j].labs[0], panels.map(function(p){ return [p.name, p.fmt(p.v[j])]; })), e.clientX, e.clientY);
  });

    each(bars, function(b){ b.setAttribute('opacity', 1); }); hideTip(); });
};

/* ---------- heatmap ---------- */
function ramp(t){
  /* one-hue sequential ramp: low values recede toward the card surface, high values carry the most contrast */
  var c0 = T.card, c1 = S2, c2 = T.ink;
  t = clamp(t, 0, 1);
  if(!isHex(c0) || !isHex(c1)) return 'rgba(217,89,38,'+(0.15+0.85*t)+')';
  if(t < 0.7) return mix(c0, c1, 0.15+0.85*t/0.7);
  return mix(c1, isHex(c2) ? c2 : '#ffffff', (t-0.7)/0.3*0.45);
}
V.heatmap = function(M){
  var rc = M.cats[0], cc = M.cats[1], m1 = M.nums[0], m2 = M.nums[1];
  if(!rc || !cc || !m1) return state('Assign two categories and a measure.', true, 'grid');
  var ratio = opt('metric', '') === 'ratio' && !!m2, min = numOpt('min', 0), nr = numOpt('rows', 12), nc = numOpt('cols', 12),
      G = groups(M, [rc, cc]), rt = {}, ct = {}, cell = {}, rows, cols, vmax = 0;
  G.forEach(function(g){ rt[g.labs[0]] = (rt[g.labs[0]] || 0)+g.a[0]; ct[g.labs[1]] = (ct[g.labs[1]] || 0)+g.a[0]; cell[g.labs[0]+'\u0001'+g.labs[1]] = g; });
  rows = Object.keys(rt).sort(function(a, b){ return rt[b]-rt[a]; }).slice(0, nr);
  cols = Object.keys(ct).sort(function(a, b){ return ct[b]-ct[a]; }).slice(0, nc);
  function v(g){ return !g ? null : ratio ? (g.a[0] >= Math.max(min, 1e-12) ? g.a[1]/g.a[0] : null) : g.a[0]; }
  rows.forEach(function(r){ cols.forEach(function(c){ var x = v(cell[r+'\u0001'+c]); if(x != null && x > vmax) vmax = x; }); });
  var top = ratio ? 1 : niceMax(vmax), fv = ratio ? function(x){ return pct(x); } : m1.fmt;
  var f = card('', opt('icon', 'grid'), '<span>Largest '+rows.length+' × '+cols.length+'</span>');
  if(!rows.length){ f.bd.appendChild(el('div', 'state', 'No data')); return; }
  var w = f.bd.clientWidth, h = f.bd.clientHeight, longR = 0, longC = 0;
  rows.forEach(function(r){ longR = Math.max(longR, r.length); }); cols.forEach(function(c){ longC = Math.max(longC, c.length); });
  var lw = clamp(longR*6.1+10, 60, w*0.34), lgH = 30, ch = clamp(Math.min(longC, 22)*5.2*0.72+14, 30, 110),
      cw = (w-lw-clamp(Math.min(longC, 22)*5.2*0.72-20, 14, 90))/cols.length, rh = Math.min(34, (h-ch-lgH-6)/rows.length), gp = 2, s = '', i, j, x, y;
  if(cw < 8 || rh < 8){ f.bd.appendChild(el('div', 'state', 'Make this object larger to show the grid')); return; }
  function cut(t, n){ return t.length > n ? t.slice(0, n-1)+'…' : t; }
  var maxC = Math.max(4, Math.floor(ch/5.2/0.72)), maxR = Math.max(4, Math.floor((lw-10)/6.1));
  for(j=0;j<cols.length;j++){ x = lw+cw*(j+0.5);
    s += '<text transform="translate('+(x+3)+' '+(ch-6)+') rotate(-45)" fill="'+T.ink2+'" font-size="10.5"><title>'+esc(cols[j])+'</title>'+esc(cut(cols[j], maxC))+'</text>'; }
  for(i=0;i<rows.length;i++){ y = ch+rh*i;
    s += '<text x="'+(lw-8)+'" y="'+(y+rh/2+4)+'" text-anchor="end" fill="'+T.ink2+'" font-size="11"><title>'+esc(rows[i])+'</title>'+esc(cut(rows[i], maxR))+'</text>';
    for(j=0;j<cols.length;j++){ x = lw+cw*j; var g = cell[rows[i]+'\u0001'+cols[j]], vv = v(g), ok = vv != null, t = ok ? vv/top : 0;
      s += '<rect class="c" data-i="'+i+'" data-j="'+j+'" x="'+(x+gp/2)+'" y="'+(y+gp/2)+'" width="'+(cw-gp)+'" height="'+(rh-gp)+'" rx="3" '+
        (ok ? 'fill="'+ramp(t)+'"' : 'fill="transparent" stroke="'+T.line+'" stroke-dasharray="2 2"')+'/>';
      if(ok && cw >= 26 && rh >= 15) s += '<text x="'+(x+cw/2)+'" y="'+(y+rh/2+3.5)+'" text-anchor="middle" font-size="'+(cw >= 34 ? 10.5 : 9.5)+'" fill="'+(t > 0.62 ? T.card : T.ink)+'" pointer-events="none">'+
        (ratio ? Math.round(vv*100) : compact(vv))+'</text>';
    } }
  var ly = ch+rh*rows.length+12, lx = lw, gid = uid('hg'), st = '', q;
  for(q=0;q<=10;q++) st += '<stop offset="'+(q/10)+'" stop-color="'+ramp(q/10)+'"/>';
  s += '<defs><linearGradient id="'+gid+'">'+st+'</linearGradient></defs>'+
    '<text x="'+lx+'" y="'+(ly+9)+'" fill="'+T.muted+'" font-size="10.5">'+(ratio ? '0%' : '0')+'</text>'+
    '<rect x="'+(lx+22)+'" y="'+ly+'" width="120" height="10" rx="3" fill="url(#'+gid+')"/>'+
    '<text x="'+(lx+148)+'" y="'+(ly+9)+'" fill="'+T.muted+'" font-size="10.5">'+esc(ratio ? '100% '+ratioName(M) : compact(top)+' '+m1.name)+'</text>';
  if(ratio && min){ var mxl = Math.min(lx+300, w-110), myl = mxl < lx+250 ? ly+16 : ly;
    s += '<rect x="'+mxl+'" y="'+myl+'" width="14" height="10" rx="3" fill="transparent" stroke="'+T.line2+'" stroke-dasharray="2 2"/>'+
    '<text x="'+(mxl+20)+'" y="'+(myl+9)+'" fill="'+T.muted+'" font-size="10.5">base under '+min+'</text>'; }
  f.bd.innerHTML = '<svg width="'+w+'" height="'+h+'" style="display:block">'+s+'</svg>';
  each(f.bd.querySelectorAll('rect.c'), function(r){
    r.addEventListener('mousemove', function(e){
      var a = rows[+r.getAttribute('data-i')], b = cols[+r.getAttribute('data-j')], g = cell[a+'\u0001'+b], p;
      if(!g) p = [[m1.name, '0']];
      else { p = [[m1.name, m1.fmt(g.a[0])]]; if(m2) p.push([m2.name, m2.fmt(g.a[1])]);
        if(ratio) p.unshift([ratioName(M), v(g) == null ? 'below the minimum' : pct(v(g))]); }
      r.setAttribute('stroke', T.ink); r.setAttribute('stroke-width', '1.5');
      showTip(tipHtml(a+' × '+b, p), e.clientX, e.clientY); });
    r.addEventListener('mouseleave', function(){ if(r.getAttribute('stroke-dasharray')) r.setAttribute('stroke', T.line); else r.removeAttribute('stroke'); r.setAttribute('stroke-width', '1'); hideTip(); });
  });
};

/* ---------- table ---------- */
V.table = function(M){
  var icon = opt('icon', 'table'), nc = numOpt('cats', M.cats.length), cols = [], ratio = opt('ratio', '') === '1' && M.nums.length > 1, min = numOpt('min', 0);
  var all = M.cats.concat(M.nums).sort(function(a, b){ return a.i-b.i; });
  if(!all.length) return state('Assign columns in the Roles pane.', true, icon);
  all.forEach(function(c, j){ cols.push({c:c, name:c.name, num:j >= nc && c.k === 'num'}); });
  var firstNum = null;
  cols.forEach(function(c){ if(c.num && !firstNum) firstNum = c; });
  if(ratio) cols.push({name:ratioName(M), num:true, pctCol:true});
  var data = [], m1 = M.nums[0], m2 = M.nums[1];
  M.rows.forEach(function(row){ if(!Array.isArray(row)) return;
    var r = {t:[], v:[], low:false};
    cols.forEach(function(c){
      if(c.pctCol){ var n = val(row, m1), x = val(row, m2); r.low = !(n >= Math.max(min, 1e-12)); r.t.push(r.low ? null : x/n); r.v.push(r.low ? -1 : x/n); }
      else if(c.num){ var q = toNum(row[c.c.i]); r.t.push(q); r.v.push(q == null ? -Infinity : q); }
      else { r.t.push(label(row[c.c.i], c.c.c)); r.v.push(sortKey(row[c.c.i], c.c.c)); }
    });
    data.push(r); });
  if(!S.sort){ var dflt = 0; cols.forEach(function(c, j){ if(c === firstNum) dflt = j; }); S.sort = {j:dflt, dir:cols[dflt] && cols[dflt].num ? -1 : 1}; }
  var f = card('', icon, '<span class="cnt"></span><input type="search" placeholder="Search" aria-label="Search the table">');
  var inp = f.hd.querySelector('input'), cnt = f.hd.querySelector('.cnt');
  inp.value = S.q; if(boxW() < 420) inp.style.width = '100px';
  var tw = el('div', 'tw'); f.bd.appendChild(tw);
  var mx = {}; cols.forEach(function(c, j){ if(c.num){ var m = 0; data.forEach(function(r){ if(r.t[j] > m) m = r.t[j]; }); mx[j] = c.pctCol ? Math.min(1, niceMax(m)) : m || 1; } });
  var CAP = 400, barCol = opt('bar', '1') !== '0';
  function draw(){
    var q = S.q.toLowerCase(), rows = data.filter(function(r){ if(!q) return true;
      for(var j=0;j<cols.length;j++) if(!cols[j].num && String(r.t[j]).toLowerCase().indexOf(q) >= 0) return true; return false; });
    var sj = S.sort.j, sd = S.sort.dir;
    rows.sort(function(a, b){ var x = a.v[sj], y = b.v[sj];
      if(typeof x === 'number' && typeof y === 'number') return sd*(x-y);
      return sd*String(a.t[sj]).localeCompare(String(b.t[sj]), undefined, {numeric:true, sensitivity:'base'}); });
    var h = '<table><thead><tr>';
    cols.forEach(function(c, j){ h += '<th class="'+(c.num ? 'n' : '')+'" data-j="'+j+'" tabindex="0" aria-sort="'+(sj === j ? (sd > 0 ? 'ascending' : 'descending') : 'none')+'">'+esc(c.name)+
      (sj === j ? '<span class="ar">'+(sd > 0 ? '▲' : '▼')+'</span>' : '')+'</th>'; });
    h += '</tr></thead><tbody>';
    rows.slice(0, CAP).forEach(function(r){
      h += '<tr'+(r.low ? ' class="low" title="Below the minimum of '+min+'"' : '')+'>';
      cols.forEach(function(c, j){ var t = r.t[j];
        if(c.pctCol) h += '<td class="n">'+(t == null ? '–' : '<span class="ib">'+pct(t)+'<span class="t"><i style="width:'+(t/mx[j]*100)+'%;background:'+S2+'"></i></span></span>')+'</td>';
        else if(c === firstNum && barCol && !ratio) h += '<td class="n"><span class="ib">'+c.c.fmt(t)+'<span class="t"><i style="width:'+(Math.max(0, t || 0)/mx[j]*100)+'%;background:'+S1+'"></i></span></span></td>';
        else if(c.num) h += '<td class="n">'+c.c.fmt(t)+'</td>';
        else h += '<td title="'+esc(t)+'">'+esc(t)+'</td>';
      });
      h += '</tr>'; });
    if(!rows.length) h += '<tr><td colspan="'+cols.length+'" style="text-align:center;padding:18px">No match</td></tr>';
    tw.innerHTML = h+'</tbody></table>';
    cnt.textContent = (rows.length > CAP ? 'First '+CAP+' of ' : '')+group(rows.length)+' rows';
    each(tw.querySelectorAll('th'), function(th){ activate(th, function(){
      var j = +th.getAttribute('data-j'); S.sort = {j:j, dir:S.sort.j === j ? -S.sort.dir : (cols[j].num ? -1 : 1)}; draw(); }); });
  }
  inp.addEventListener('input', function(){ S.q = inp.value; draw(); });
  draw();
  var notes = []; if(ratio && min) notes.push(ratioName(M)+' shown only when '+m1.name+' is '+min+' or more'); var tn = truncNote(M); if(tn) notes.push(tn);
  footer(f, notes.join(' · '));
};

/* ---------- donut ---------- */
V.donut = function(M){
  var cat = M.cats[0], m1 = M.nums[0], top = Math.min(numOpt('top', 6), SLOTS.length), center = opt('center', m1 ? m1.name : 'Total');
  if(!cat || !m1) return state('Assign a category and a measure in the Roles pane.', true, 'donut');
  var G = groups(M, [cat]).filter(function(g){ return g.a[0] > 0; }), tot = 0, list, rest;
  G.sort(function(a, b){ return b.a[0]-a.a[0]; });
  G.forEach(function(g){ tot += g.a[0]; });
  list = G.slice(0, top);
  if(G.length > top){ rest = {key:'\u0002other', labs:['Other ('+(G.length-top)+')'], a:[0], rows:[], other:true};
    G.slice(top).forEach(function(g){ rest.a[0] += g.a[0]; rest.rows = rest.rows.concat(g.rows); if(g.brushed) rest.brushed = true; }); list.push(rest); }
  list.forEach(function(g, i){ g.col = g.other ? T.other : SLOTS[i]; });
  if(isSource()) bindSel(list);
  var f = card(hasSel() ? 'sel' : '', opt('icon', 'donut'));
  if(isSource()) footer(f, CLICK);
  if(!tot){ f.bd.appendChild(el('div', 'state', 'No data')); return; }
  var w = f.bd.clientWidth, h = f.bd.clientHeight, wide = w > h*1.25, size = wide ? Math.min(h-12, w*0.5) : Math.min(w-28, h*0.58);
  size = Math.max(80, size);
  var box = el('div', 'dn'+(wide ? '' : ' vert')), R = size/2, r0 = R*0.62, a0 = -Math.PI/2, s = '';
  function arc(a1, a2){ var big = a2-a1 > Math.PI ? 1 : 0, c1 = Math.cos(a1), s1 = Math.sin(a1), c2 = Math.cos(a2), s2 = Math.sin(a2);
    return 'M'+(R+R*c1)+' '+(R+R*s1)+'A'+R+' '+R+' 0 '+big+' 1 '+(R+R*c2)+' '+(R+R*s2)+
      'L'+(R+r0*c2)+' '+(R+r0*s2)+'A'+r0+' '+r0+' 0 '+big+' 0 '+(R+r0*c1)+' '+(R+r0*s1)+'Z'; }
  list.forEach(function(g, i){ var a1 = a0, a2 = list.length === 1 ? a1+Math.PI*2-0.0001 : a0+Math.max(0.0001, g.a[0]/tot*Math.PI*2); a0 = a2;
    s += '<path class="slice'+(S.sel[g.key] ? ' on' : '')+'" data-i="'+i+'" d="'+arc(a1, a2)+'" fill="'+g.col+'" stroke="'+T.card+'" stroke-width="2"/>'; });
  var cfs = clamp(size*0.13, 14, 30), fm = m1.fmt;
  box.innerHTML = '<div class="pie" style="width:'+size+'px;height:'+size+'px;'+(wide ? '' : 'align-self:center')+'"><svg width="'+size+'" height="'+size+'" style="display:block">'+s+
    '<text class="cv" x="'+R+'" y="'+(R+cfs*0.25)+'" text-anchor="middle" fill="'+T.ink+'" font-size="'+cfs+'" font-weight="650">'+compact(tot)+'</text>'+
    '<text class="cl" x="'+R+'" y="'+(R+cfs*0.25+15)+'" text-anchor="middle" fill="'+T.muted+'" font-size="11">'+esc(center.length > 20 ? center.slice(0, 19)+'…' : center)+'</text></svg></div>';
  var lg = el('div', 'lgd'), h2 = '';
  list.forEach(function(g, i){ h2 += '<div class="lg'+(S.sel[g.key] ? ' on' : '')+'" tabindex="0" role="button" data-i="'+i+'"><i style="background:'+g.col+'"></i>'+
    '<span class="tx" title="'+esc(g.labs[0])+'">'+esc(g.labs[0])+'</span><span class="v">'+compact(g.a[0])+'</span><span class="p">'+pct(g.a[0]/tot)+'</span></div>'; });
  lg.innerHTML = h2; box.appendChild(lg); f.bd.appendChild(box);
  if(lg.clientWidth < 200) lg.className += ' narrow';
  var cvv = box.querySelector('.cv'), cl = box.querySelector('.cl');
  function hover(g, e){ cvv.textContent = pct(g.a[0]/tot); cl.textContent = g.labs[0].length > 18 ? g.labs[0].slice(0, 17)+'…' : g.labs[0];
    if(e) showTip(tipHtml(g.labs[0], [[m1.name, fm(g.a[0])], ['Share', pct(g.a[0]/tot)]]), e.clientX, e.clientY); }
  function out(){ cvv.textContent = compact(tot); cl.textContent = center.length > 20 ? center.slice(0, 19)+'…' : center; hideTip(); }
  each(box.querySelectorAll('.slice,.lg'), function(n){ var g = list[+n.getAttribute('data-i')];
    if(isSource()) activate(n, function(e){ toggle(g.key, e); });
    n.addEventListener('mousemove', function(e){ hover(g, e); }); n.addEventListener('mouseleave', out); });
};

/* ======================================================================
   Sample data when the file is opened on its own (outside VA and outside the generator preview)
   ====================================================================== */
function demoMsg(){
  var cats = ['North', 'South', 'East', 'West', 'Central', 'Coastal', 'Mountain', 'Desert'], i, j, data = [], cols,
      C = function(l){ return {label:l, type:'string', usage:'categorical'}; },
      N = function(l, f){ return {label:l, type:'number', usage:'quantitative', format:{name:f || 'COMMA', formatString:(f || 'COMMA')+'12.'}}; },
      D = {label:'Month', type:'date', usage:'categorical', format:{name:'MONYY', formatString:'MONYY7.'}},
      mon = function(k){ return Math.round((Date.UTC(2025, k, 1)-SAS0)/864e5); };
  function rnd(k){ var x = Math.sin(k*12.9898)*43758.5453; return x-Math.floor(x); }
  if(VIS === 'filter'){ cols = [C(TITLE || 'Region')]; cats.forEach(function(c){ data.push([c]); }); }
  else if(VIS === 'kpi'){ cols = [D, N('Total'), N('Part')]; for(i=0;i<18;i++) data.push([mon(i), 900+Math.round(300*rnd(i)), 200+Math.round(120*rnd(i+50))]); }
  else if(VIS === 'line' || (VIS === 'vbar' && opt('date', '') !== '0')){ cols = [D, N('Total'), N('Part')]; for(i=0;i<18;i++) data.push([mon(i), 900+i*20+Math.round(300*rnd(i)), 200+Math.round(120*rnd(i+50))]); }
  else if(VIS === 'heatmap'){ cols = [C('Region'), C('Product'), N('Total'), N('Part')];
    for(i=0;i<8;i++) for(j=0;j<8;j++) data.push([cats[i], 'Product '+String.fromCharCode(65+j), 50+Math.round(400*rnd(i*9+j)), Math.round(40*rnd(i*7+j+3))]); }
  else if(VIS === 'table'){ cols = [C('Region'), C('Product'), N('Total'), N('Part')];
    for(i=0;i<8;i++) for(j=0;j<4;j++) data.push([cats[i], 'Product '+String.fromCharCode(65+j), 50+Math.round(400*rnd(i*9+j)), Math.round(40*rnd(i*7+j+3))]); }
  else { cols = [C('Region'), N('Total'), N('Part')]; cats.forEach(function(c, k){ var t = 300+Math.round(900*rnd(k+1)); data.push([c, t, Math.round(t*0.3*rnd(k+9))]); }); }
  cols.forEach(function(c, k){ c.name = 'bi'+(k+1); });
  return {version:'1', resultName:'sample', rowCount:data.length, availableRowCount:data.length, columns:cols, data:data};
}

/* ======================================================================
   Run
   ====================================================================== */
function render(){
  hideTip();
  if(VIS === 'bg'){ V.bg(); return; }
  if(!V[VIS]){ state('Unknown visual "'+VIS+'".', true); return; }
  if(!S.M){ if(VIS === 'filter' && opt('mode', 'pills') !== 'list'){
      app.innerHTML = '<div class="flt"><span class="lab">'+svgIcon(opt('icon', '') || guessIcon(TITLE))+'<span>'+esc(TITLE || 'Filter')+'</span></span><span class="state" style="position:static">Waiting for data</span></div>'; }
    else state('Waiting for data from SAS Visual Analytics…', false, opt('icon', '') || null);
    return; }
  if(!S.M.rows.length && VIS !== 'filter'){ state('No data for the current filters.', false, opt('icon', '') || null); return; }
  V[VIS](S.M);
}
window.addEventListener('message', function(e){
  var m = e.data;
  if(typeof m === 'string'){ try { m = JSON.parse(m); } catch(err){ return; } }
  if(!m || typeof m !== 'object' || !Array.isArray(m.columns)) return;
  S.M = model(m); render();
}, false);
var rt = null;
function refit(){ var p = S.prev; render(); S.prev = p; }
window.addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(function(){ fitBox(); refit(); }, 120); });
setInterval(function(){ if(fitBox()) refit(); }, 1000);
window.addEventListener('error', function(e){ document.body.appendChild(el('div', 'err', 'Script error: '+esc(e.message || e))); });
if(DEMO && VIS !== 'bg') S.M = model(demoMsg());
render();
})();
